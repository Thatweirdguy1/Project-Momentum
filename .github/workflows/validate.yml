name: Validate local tools and reference artifacts
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: node web/calculators/engine.test.mjs
      - run: node --check web/app.mjs
      - run: python scripts/validate_artifacts.py
